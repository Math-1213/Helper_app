<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>App de Teste - Helper</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <style>
      :root {
        --bg-color: #0a0a0c;
        --card-bg: #121216;
        --text-main: #ededf2;
        --text-muted: #8c8c9e;
        --primary: #7c4dff;
        --border: #22222a;
      }

      body {
        margin: 0;
        padding: 20px;
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, var(--primary), #b388ff);
        border-radius: 16px;
        font-size: 28px;
        font-weight: bold;
        color: #fff;
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
      }

      p.subtitle {
        margin: 5px 0 0 0;
        color: var(--text-muted);
        font-size: 14px;
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 20px;
      }

      h2 {
        margin-top: 0;
        font-size: 16px;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border);
        padding-bottom: 10px;
        margin-bottom: 15px;
      }

      button {
        background-color: var(--primary);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 15px;
        font-weight: 600;
        width: 100%;
        margin-bottom: 10px;
        cursor: pointer;
      }

      button:active {
        opacity: 0.8;
      }

      .log-container {
        background-color: #000;
        border-radius: 8px;
        padding: 12px;
        height: 150px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 12px;
        color: #4ade80;
      }

      .log-entry {
        margin-bottom: 4px;
        word-break: break-all;
      }

      .log-out {
        color: #60a5fa;
      }
      .log-in {
        color: #4ade80;
      }
      .log-err {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">H</div>
      <h1>Helper Tester</h1>
      <p class="subtitle">Módulo de Validação de Bridges</p>
    </div>

    <div class="card">
      <h2>Bridges Disponíveis</h2>

      <!-- Ajuste os payloads de acordo com a estrutura que suas bridges esperam no handleBridgeMessage -->
      <button
        onclick="
          testBridge('storage', 'setItem', {
            key: 'teste_key',
            value: 'Dados salvos com sucesso!',
          })
        "
      >
        Testar Storage Bridge (Save)
      </button>

      <button onclick="testBridge('location', 'getCurrentPosition', {})">
        Testar Location Bridge
      </button>

      <button
        onclick="testBridge('console', 'log', { message: 'Olá do WebView!' })"
      >
        Testar Console Bridge
      </button>
    </div>

    <div class="card">
      <h2>Console Logs</h2>
      <div id="log-area" class="log-container"></div>
    </div>

    <script>
      const logArea = document.getElementById("log-area");

      function appendLog(message, type = "out") {
        const el = document.createElement("div");
        el.className = `log-entry log-${type}`;

        const time = new Date().toLocaleTimeString();
        el.textContent = `[${time}] ${type === "out" ? "↑" : "↓"} ${message}`;

        logArea.appendChild(el);
        logArea.scrollTop = logArea.scrollHeight;
      }

      function testBridge(bridgeName, action, data) {
        const payload = {
          bridge: bridgeName,
          action: action,
          data: data,
        };

        const jsonPayload = JSON.stringify(payload);

        if (window.ReactNativeWebView) {
          appendLog(jsonPayload, "out");
          window.ReactNativeWebView.postMessage(jsonPayload);
        } else {
          appendLog(
            "ReactNativeWebView não encontrado. Está rodando no app?",
            "err",
          );
        }
      }

      // Escuta respostas vindas das bridges do React Native (sendToWebView)
      const handleNativeMessage = (event) => {
        try {
          // Se a bridge enviar JSON, pode fazer parse aqui
          appendLog(event.data, "in");
        } catch (e) {
          appendLog(event.data, "in");
        }
      };

      // iOS dispara no window, Android pode disparar no document
      window.addEventListener("message", handleNativeMessage);
      document.addEventListener("message", handleNativeMessage);
    </script>
  </body>
</html>
